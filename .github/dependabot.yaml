version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    assignees:
      - "gobbledygook88"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    assignees:
      - "gobbledygook88"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/js"
          - "typescript-eslint"
          - "eslint-plugin-*"
