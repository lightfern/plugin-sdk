name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Tag a new version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Release the package.json version if it isn't tagged yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version package.json)
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            exit 0
          fi
          awk -v heading="## [$VERSION]" '/^## \[/ { p = index($0, heading) == 1; next } p' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no entry for $VERSION"
            exit 1
          fi
          echo "**Full diff**: https://github.com/$GITHUB_REPOSITORY/compare/$(git describe --tags --abbrev=0)...v$VERSION" >> notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
