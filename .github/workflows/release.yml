name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Tag a new version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Release the package.json version if it isn't tagged yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version package.json)
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            exit 0
          fi
          awk -v heading="## [$VERSION]" '/^## \[/ { p = index($0, heading) == 1; next } p' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no entry for $VERSION"
            exit 1
          fi
          echo "**Full diff**: https://github.com/$GITHUB_REPOSITORY/compare/$(git describe --tags --abbrev=0)...v$VERSION" >> notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file notes.md
